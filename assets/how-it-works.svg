<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="How it works: a generic agent pack plus a private project profile are installed by install.sh into the project's .claude folder">
  <title>How it works: agents (method, public) + profile (facts, private) → install.sh → your project</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker>
  </defs>
  <rect width="1280" height="440" rx="24" fill="#0F172A"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- agents -->
    <rect x="48" y="48" width="380" height="156" rx="20" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <text x="76" y="92" font-size="15" font-weight="700" fill="#A5B4FC" letter-spacing="2">PUBLIC · IN THIS REPO</text>
    <text x="76" y="132" font-size="30" font-weight="800" fill="#FFFFFF">agents/&lt;pack&gt;/</text>
    <text x="76" y="168" font-size="19" fill="#CBD5E1">The method. Generic, safe to share.</text>
    <!-- profile -->
    <rect x="48" y="236" width="380" height="156" rx="20" fill="#1E293B" stroke="#EAB308" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="76" y="280" font-size="15" font-weight="700" fill="#FDE68A" letter-spacing="2">PRIVATE · ON YOUR MACHINE</text>
    <text x="76" y="320" font-size="30" font-weight="800" fill="#FFFFFF">profiles/&lt;project&gt;/</text>
    <text x="76" y="356" font-size="19" fill="#CBD5E1">The facts. Domain, IDs, rules.</text>
    <!-- arrows to install -->
    <path d="M428 126 C 480 126, 480 200, 520 214" stroke="#94A3B8" stroke-width="3" fill="none" marker-end="url(#arr)"/>
    <path d="M428 314 C 480 314, 480 240, 520 226" stroke="#94A3B8" stroke-width="3" fill="none" marker-end="url(#arr)"/>
    <!-- install -->
    <rect x="528" y="164" width="224" height="112" rx="56" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <text x="640" y="214" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">install.sh</text>
    <text x="640" y="246" font-size="16" fill="#C7D2FE" text-anchor="middle">never overwrites</text>
    <path d="M752 220 H 838" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>
    <!-- project -->
    <rect x="848" y="48" width="384" height="344" rx="20" fill="#1E293B" stroke="#22C55E" stroke-width="2"/>
    <text x="876" y="92" font-size="15" font-weight="700" fill="#86EFAC" letter-spacing="2">YOUR PROJECT</text>
    <text x="876" y="134" font-size="26" font-weight="800" fill="#FFFFFF">.claude/</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#E2E8F0">
      <text x="900" y="184">agents/</text>
      <text x="930" y="216" fill="#CBD5E1">seo-strategist.md</text>
      <text x="930" y="246" fill="#CBD5E1">fact-checker.md</text>
      <text x="930" y="276" fill="#CBD5E1">ai-visibility-tracker.md</text>
      <text x="900" y="318">profiles/</text>
      <text x="930" y="348" fill="#FDE68A">seo.md  · git-ignored</text>
    </g>
  </g>
</svg>
