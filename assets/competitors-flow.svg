<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="Competitor pipeline: search, clean, read site, judge, score, then you review; reviewed competitors feed the positioning map and the content and offer gaps">
  <title>Competitor pipeline: search → clean → read site → judge → score → you review → map and gaps</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs>
  <rect width="1280" height="460" rx="24" fill="#0F172A"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="62" font-size="15" font-weight="700" fill="#FDBA74" letter-spacing="2">COMPETITOR-SCOUT</text>
    <g font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <rect x="48" y="84" width="170" height="96" rx="18" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
      <text x="133" y="124">8 queries</text><text x="133" y="152" font-size="14" font-weight="400" fill="#CBD5E1">market · language</text>
      <rect x="250" y="84" width="170" height="96" rx="18" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
      <text x="335" y="124">Search</text><text x="335" y="152" font-size="14" font-weight="400" fill="#CBD5E1">results only, no memory</text>
      <rect x="452" y="84" width="170" height="96" rx="18" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
      <text x="537" y="124">Clean</text><text x="537" y="152" font-size="14" font-weight="400" fill="#CBD5E1">no directories · social</text>
      <rect x="654" y="84" width="170" height="96" rx="18" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
      <text x="739" y="124">Read site</text><text x="739" y="152" font-size="14" font-weight="400" fill="#CBD5E1">unreadable = dropped</text>
      <rect x="856" y="84" width="170" height="96" rx="18" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
      <text x="941" y="124">Judge</text><text x="941" y="152" font-size="14" font-weight="400" fill="#CBD5E1">reason must cite proof</text>
      <rect x="1058" y="84" width="174" height="96" rx="18" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
      <text x="1145" y="124">Score</text><text x="1145" y="152" font-size="14" font-weight="400" fill="#CBD5E1">fixed formula · max 10</text>
    </g>
    <g stroke="#94A3B8" stroke-width="3"><path d="M218 132H244" marker-end="url(#a)"/><path d="M420 132H446" marker-end="url(#a)"/><path d="M622 132H648" marker-end="url(#a)"/><path d="M824 132H850" marker-end="url(#a)"/><path d="M1026 132H1052" marker-end="url(#a)"/></g>
    <!-- review -->
    <path d="M1145 180 V 214 H 760 V 232" stroke="#94A3B8" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <rect x="460" y="238" width="600" height="80" rx="40" fill="#422006" stroke="#EAB308" stroke-width="2"/>
    <circle cx="510" cy="278" r="14" fill="#EAB308"/>
    <text x="538" y="272" font-size="21" font-weight="800" fill="#FDE68A">You review</text>
    <text x="538" y="298" font-size="15" fill="#FDE68A">accept · reject with a reason → the next run learns</text>
    <path d="M460 278 C 300 278, 140 260, 133 190" stroke="#EAB308" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>
    <text x="150" y="248" font-size="14" fill="#FDE68A">rejections steer the next queries</text>
    <!-- downstream -->
    <path d="M640 318 L 420 362" stroke="#94A3B8" stroke-width="3" marker-end="url(#a)"/>
    <path d="M880 318 L 1000 362" stroke="#94A3B8" stroke-width="3" marker-end="url(#a)"/>
    <rect x="160" y="366" width="440" height="70" rx="18" fill="#1E293B" stroke="#A855F7" stroke-width="2"/>
    <text x="380" y="398" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle">positioning-mapper</text>
    <text x="380" y="422" font-size="15" fill="#D8B4FE" text-anchor="middle">maps · white space · content angles</text>
    <rect x="780" y="366" width="440" height="70" rx="18" fill="#1E293B" stroke="#14B8A6" stroke-width="2"/>
    <text x="1000" y="398" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle">content-offer-gap</text>
    <text x="1000" y="422" font-size="15" fill="#5EEAD4" text-anchor="middle">what they publish · what they sell</text>
  </g>
</svg>
